[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csvftps"
dynamic = ["version"]
description = "Convert a CSV with your own rules and upload it to an FTPS server on a schedule. Desktop app + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SilentCasting" }]
keywords = ["csv", "ftps", "ftp", "upload", "sync", "schedule", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2",
    "keyring>=25",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
csvftps = "csvftps.cli:main"

[project.gui-scripts]
csvftps-gui = "csvftps.gui:main"

[project.urls]
Homepage = "https://github.com/SilentCasting/csvftps"
Issues = "https://github.com/SilentCasting/csvftps/issues"
Releases = "https://github.com/SilentCasting/csvftps/releases"

[tool.hatch.version]
path = "src/csvftps/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/csvftps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
